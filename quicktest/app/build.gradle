plugins { id "com.android.application" }

android {
    namespace "bslsjdk.mcjavanpu.quicktest"
    compileSdk 36

    defaultConfig {
        applicationId "bslsjdk.mcjavanpu.quicktest"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}
