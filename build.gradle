plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    def androidHome = System.getenv("ANDROID_HOME")
    if (!androidHome) throw new GradleException("ANDROID_HOME is required to compile Android LocalSocket APIs")
    compileOnly files("${androidHome}/platforms/android-35/android.jar")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("quickTestJar", Jar) {
    group = "build"
    description = "Builds a standalone executable MCJavaNPU diagnostic JAR."
    dependsOn tasks.named("classes"), tasks.named("processResources")
    archiveBaseName = "mcjavanpu-quicktest"
    archiveVersion = ""
    destinationDirectory = layout.buildDirectory.dir("quicktest")

    from(sourceSets.main.output) {
        include "bslsjdk/mcjavanpu/QuickTestMain.class"
        include "bslsjdk/mcjavanpu/NpuRuntime*.class"
        include "bslsjdk/mcjavanpu/NpuServiceClient*.class"
    }

    from(sourceSets.main.output.resourcesDir) {
        include "natives/**"
    }

    manifest {
        attributes("Main-Class": "bslsjdk.mcjavanpu.QuickTestMain")
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
