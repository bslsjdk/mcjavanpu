plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def nativeLibDir = layout.buildDirectory.dir("generated/native/arm64-v8a")

tasks.register("buildNativeIpc") {
    inputs.file("src/main/cpp/mcjavanpu_ipc.c")
    outputs.file(nativeLibDir.map { it.file("libmcjavanpu_native.so") })

    doLast {
        def ndk = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
        if (!ndk) {
            throw new GradleException("ANDROID_NDK_HOME/ANDROID_NDK_ROOT is required to build the direct IPC native client")
        }

        def clang = file("${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang")
        if (!clang.exists()) {
            throw new GradleException("Android NDK clang not found: ${clang}")
        }

        def javaHome = file(System.getProperty("java.home"))
        def output = file("${layout.buildDirectory.get()}/generated/native/arm64-v8a/libmcjavanpu_native.so")
        output.parentFile.mkdirs()

        project.exec {
            commandLine clang.absolutePath,
                    "-shared",
                    "-fPIC",
                    "-O2",
                    "-fvisibility=hidden",
                    "-I${javaHome}/include",
                    "-I${javaHome}/include/linux",
                    "src/main/cpp/mcjavanpu_ipc.c",
                    "-o",
                    output.absolutePath
        }
    }
}

processResources {
    dependsOn(tasks.named("buildNativeIpc"))
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
    from(nativeLibDir) {
        into("natives/arm64-v8a")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
