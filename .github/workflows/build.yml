name: build-mcjavanpu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Fetch verified QNN headers and runtime
        run: git clone --depth 1 https://github.com/bslsjdk/npu_probe.git qnn_probe

      - name: Stage complete QNN HTP V73 userspace stack
        run: |
          set -eux
          mkdir -p src/main/resources/natives/arm64-v8a/qnn

          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libc++_shared.so              src/main/resources/natives/arm64-v8a/qnn/

          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtp.so              src/main/resources/natives/arm64-v8a/qnn/
          cp qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpV73.so              src/main/resources/natives/arm64-v8a/qnn/
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libQnnHtpV73Stub.so              src/main/resources/natives/arm64-v8a/qnn/
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libQnnHtpV73Skel.so              src/main/resources/natives/arm64-v8a/qnn/
          cp qnn_probe/app/src/main/jniLibs/arm64-v8a/libQnnSystem.so              src/main/resources/natives/arm64-v8a/qnn/

          gzip -dc qnn_probe/app/src/main/assets/qnnlibs/libQnnHtpPrepare.so.gz              > src/main/resources/natives/arm64-v8a/qnn/libQnnHtpPrepare.so

          ls -lh src/main/resources/natives/arm64-v8a/qnn

      - name: Build ARM64 native runtime
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          cmake -S src/main/cpp -B build/native             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-35             -DQNN_INC="$GITHUB_WORKSPACE/qnn_probe/app/src/main/cpp/qnn_inc"
          cmake --build build/native --config Release
          mkdir -p src/main/resources/natives/arm64-v8a
          cp build/native/libmcjavanpu.so src/main/resources/natives/arm64-v8a/libmcjavanpu.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Fabric mod
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mcjavanpu
          path: build/libs/*.jar
