name: build-mcjavanpu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Fabric mod
        run: gradle build --no-daemon

      # Actions artifact upload still fails while the account's metered storage is
      # exhausted (it resets around 2026-11-01 and deleting artifacts does not lower
      # metered usage). continue-on-error keeps it from turning a green build red, but
      # note it also masks the failure: the step reports success even when the artifact
      # was never created. Do not read this step as "the jar is downloadable".
      - name: Upload mod
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mcjavanpu
          path: |
            build/libs/*.jar
          overwrite: true
          retention-days: 3

      # The real delivery route. Release assets are not metered against Actions storage,
      # so this works even when the artifact upload above is rejected. Rolling tag, one
      # asset, replaced every build.
      - name: Publish jar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          JAR=$(ls build/libs/*.jar | head -1)
          test -f "$JAR"
          gh release delete latest-jar --yes --cleanup-tag || true
          gh release create latest-jar "$JAR"             --prerelease             --title "mcjavanpu latest build"             --notes "Auto-published build of ${GITHUB_SHA}. Permanent download link that does not depend on Actions storage."

      # Kept as a second route: git-based, also outside Actions storage.
      - name: Publish jar to the builds branch
        run: |
          set -eux
          JAR=$(ls build/libs/*.jar | head -1)
          git config user.name ci
          git config user.email ci@local
          git checkout -B builds
          cp "$JAR" mcjavanpu.jar
          git add -f mcjavanpu.jar
          git commit -m "mcjavanpu build of ${GITHUB_SHA}" || echo "jar unchanged"
          git push -f origin builds
