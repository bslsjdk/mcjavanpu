name: build-mcjavanpu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mod
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-35"

      - name: Fetch verified QNN headers and runtime
        run: git clone --depth 1 https://github.com/bslsjdk/npu_probe.git qnn_probe

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Fabric mod
        run: gradle build --no-daemon

      - name: Build standalone executable QuickTest JAR
        run: gradle quickTestJar --no-daemon

      - name: Upload mod and QuickTest JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcjavanpu
          path: |
            build/libs/*.jar
            build/quicktest/*.jar
